<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bot gửi email</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="markets.css">
<style>
/* ---------- Shell: sidebar + main ---------- */
.app-shell{display:flex;align-items:flex-start;}
.sidebar{
  width:232px;flex-shrink:0;align-self:stretch;
  padding:16px 12px;background:var(--bg);border-right:1px solid var(--border);
  min-height:calc(100vh - 52px);
}
.sidebar-section + .sidebar-section{margin-top:20px;}
.sidebar-label{font-size:12px;font-weight:600;color:var(--text-tertiary);padding:0 8px;margin:0 0 6px;}
.nav-item{
  display:flex;align-items:center;gap:8px;
  height:32px;padding:0 8px;border-radius:var(--radius-md);
  font-size:13.5px;color:var(--text-secondary);cursor:pointer;text-decoration:none;user-select:none;
}
.nav-item:hover{background:var(--surface-alt);color:var(--text);}
.nav-item .dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;background:var(--text-tertiary);}
.nav-item.price .dot{background:var(--cat-price);}
.nav-item.finance .dot{background:var(--cat-finance);}
.nav-item.social .dot{background:var(--cat-social);}
.nav-item.active{background:var(--brand-tint);color:var(--brand);font-weight:600;}
.nav-item .count{margin-left:auto;font-size:12px;color:var(--text-tertiary);font-variant-numeric:tabular-nums;}
.nav-item.active .count{color:var(--brand);}

.sidebar-token{padding:0 8px;}
.sidebar-token label{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:4px;}
.side-actions{display:flex;gap:6px;margin-top:8px;}
.side-actions .btn{flex:1;}
.side-help{font-size:12px;color:var(--text-tertiary);margin:8px 0 0;line-height:1.45;}

.main-content{flex:1;min-width:0;}
.wrap{padding:20px 24px 56px;max-width:1240px;}

.search{width:240px;}

/* ---------- Filter tabs (mobile replacement for the sidebar) ---------- */
.filter-tabs{display:none;gap:6px;margin-bottom:12px;overflow-x:auto;}
.filter-tabs .tab{
  font-family:var(--font-body);font-size:13px;color:var(--text-secondary);
  background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--radius-md);
  height:30px;padding:0 12px;cursor:pointer;white-space:nowrap;
}
.filter-tabs .tab.active{color:var(--brand);background:var(--brand-tint);border-color:var(--brand);font-weight:600;}

/* ---------- Bot table ---------- */
.table-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;}
.table-scroll{overflow-x:auto;}
.board-wrap{min-width:760px;}
.table-head, .row{display:grid;grid-template-columns:minmax(220px,2.4fr) 110px 110px 120px 110px 76px;gap:16px;align-items:center;padding:0 16px;}
.table-head{
  height:38px;background:var(--surface-alt);border-bottom:1px solid var(--border);
  font-size:12px;font-weight:600;color:var(--text-secondary);
}
.th-sort{cursor:pointer;user-select:none;display:flex;align-items:center;gap:4px;}
.th-sort:hover{color:var(--text);}
.th-sort-right{justify-content:flex-end;}
.sort-arrow{font-size:9px;}
.th-sort.sort-active{color:var(--text);}

.row{padding-top:10px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.row:last-child{border-bottom:none;}
.row:hover{background:var(--surface-alt);}

.cell-bot{min-width:0;}
.name{font-size:14px;font-weight:500;}
.name a{color:var(--text);text-decoration:none;}
.name a:hover{color:var(--brand);text-decoration:underline;}
.meta{font-size:12px;color:var(--text-tertiary);margin-top:2px;}
.skeleton{display:inline-block;height:10px;border-radius:2px;background:var(--surface-alt);vertical-align:middle;}

.mail-line{
  font-size:12px;color:var(--text-secondary);margin-top:3px;
  cursor:pointer;display:flex;align-items:center;gap:5px;max-width:100%;
}
.mail-line:hover{color:var(--brand);}
.mail-line .ico{color:var(--text-tertiary);flex-shrink:0;display:inline-flex;}
.mail-line .subj{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mail-line.empty{display:none;}

.cat{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text);white-space:nowrap;}
.cat .dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;background:var(--text-tertiary);}
.cat.price .dot{background:var(--cat-price);}
.cat.finance .dot{background:var(--cat-finance);}
.cat.social .dot{background:var(--cat-social);}

.history{display:flex;gap:2px;align-items:flex-end;height:16px;}
.history i{display:block;width:8px;height:16px;border-radius:1px;background:var(--border);}
.history i.success{background:var(--success);}
.history i.failure{background:var(--danger);}

.cell-time{font-size:13px;color:var(--text-secondary);text-align:right;white-space:nowrap;}
.run-btn{justify-self:end;}

.mail-panel{
  grid-column:1 / -1;display:none;
  margin:10px 0 2px;padding:12px 14px;
  background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius-md);
  font-size:13px;line-height:1.6;
}
.mail-panel.open{display:block;}
.mail-panel .subject{color:var(--text);font-weight:600;margin-bottom:4px;}
.mail-panel .body-text{color:var(--text-secondary);white-space:pre-wrap;}
.mail-panel .sent{color:var(--text-tertiary);font-size:12px;margin-top:8px;}

.empty-state{
  display:none;text-align:center;padding:40px 24px;
  background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);
  font-size:13px;color:var(--text-secondary);
}
.empty-state .btn{margin-top:12px;}
.load-error{padding:16px;color:var(--danger);font-size:13px;}

/* ---------- Responsive ---------- */
@media (max-width:760px){
  .app-shell{display:flex;flex-direction:column;}
  .main-content{order:1;}
  .sidebar{order:2;width:auto;min-height:0;border-right:none;border-top:1px solid var(--border);padding:16px;}
  .board-wrap{min-width:0;}
  .table-head, .row{grid-template-columns:minmax(0,1fr) auto auto;gap:12px;padding-left:12px;padding-right:12px;}
  .col-cat, .col-hist, .col-run{display:none !important;}
  .views-section{display:none;}
  .filter-tabs{display:flex;}
  .wrap{padding:16px 16px 48px;}
  .search{width:100%;}
  .page-head > div{width:100%;}
}
</style>
</head>
<body>

<header class="appbar">
  <a class="appbar-name" href="./">tuongphanbase</a>
  <nav class="appbar-tabs" aria-label="Trang">
    <a href="./" aria-current="page">Bot</a>
    <a href="prices.html">Giá hôm nay</a>
    <a href="projects.html">Dự án</a>
  </nav>
  <div class="appbar-right">
    <a class="appbar-link" id="ghOrgLink" href="#" target="_blank" rel="noopener">GitHub</a>
    <button class="theme-toggle" id="themeToggle" title="Đổi giao diện sáng / tối" aria-label="Đổi giao diện sáng / tối">
      <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</header>

<div class="app-shell">
  <aside class="sidebar">
    <section class="sidebar-section views-section">
      <h2 class="sidebar-label">Nhóm</h2>
      <nav>
        <a class="nav-item active" data-filter="all"><span class="dot"></span>Tất cả<span class="count" id="countAll">—</span></a>
        <a class="nav-item price" data-filter="price"><span class="dot"></span>Giá<span class="count" id="countPrice">—</span></a>
        <a class="nav-item finance" data-filter="finance"><span class="dot"></span>Tài chính<span class="count" id="countFinance">—</span></a>
        <a class="nav-item social" data-filter="social"><span class="dot"></span>Mạng xã hội<span class="count" id="countSocial">—</span></a>
      </nav>
    </section>

    <section class="sidebar-section">
      <h2 class="sidebar-label">Kết nối GitHub</h2>
      <div class="sidebar-token">
        <label for="tok">Token (để dùng nút Chạy)</label>
        <input class="input" id="tok" type="password" placeholder="Dán fine-grained token">
        <div class="side-actions">
          <button class="btn btn-sm" id="saveTok">Lưu</button>
          <button class="btn btn-sm" id="refresh">Làm mới</button>
        </div>
        <p class="side-help" id="rateInfo"></p>
        <p class="side-help" id="lastUpdated"></p>
      </div>
    </section>
  </aside>

  <main class="main-content">
  <div class="wrap">

    <div class="page-head">
      <div>
        <h1>Bot gửi email</h1>
        <div class="page-sub" id="listCount">Đang tải…</div>
      </div>
      <input class="input search" id="topSearch" type="search" placeholder="Tìm bot" aria-label="Tìm bot">
    </div>

    <div class="filter-tabs">
      <button class="tab active" data-filter="all">Tất cả</button>
      <button class="tab" data-filter="price">Giá</button>
      <button class="tab" data-filter="finance">Tài chính</button>
      <button class="tab" data-filter="social">Mạng xã hội</button>
    </div>

    <div class="table-card">
      <div class="table-scroll">
        <div class="board-wrap">
          <div class="table-head">
            <div class="th-sort" data-sort="bot">Bot<span class="sort-arrow"></span></div>
            <div class="th-sort col-cat" data-sort="category">Nhóm<span class="sort-arrow"></span></div>
            <div class="th-sort" data-sort="status">Trạng thái<span class="sort-arrow"></span></div>
            <div class="col-hist">10 lần gần nhất</div>
            <div class="th-sort th-sort-right" data-sort="time">Lần chạy cuối<span class="sort-arrow"></span></div>
            <div class="col-run"></div>
          </div>
          <div id="board">
            <!-- rows injected here -->
          </div>
        </div>
      </div>
    </div>
    <div class="empty-state" id="emptyState">
      <div>Không có bot nào khớp<span id="emptyStateDetail"></span>.</div>
      <button class="btn btn-sm" id="clearFiltersBtn">Xoá bộ lọc</button>
    </div>

    <section class="markets" id="markets" aria-labelledby="marketsTitle">
      <div class="page-head">
        <div>
          <h2 class="markets-title" id="marketsTitle">Thị trường</h2>
          <div class="page-sub" id="marketsUpdated">Đang tải…</div>
        </div>
        <div class="range-tabs" role="group" aria-label="Khoảng thời gian">
          <button data-range="7" aria-pressed="false">7 ngày</button>
          <button data-range="30" aria-pressed="true">30 ngày</button>
          <button data-range="90" aria-pressed="false">90 ngày</button>
        </div>
      </div>
      <div id="mSections"></div>
    </section>

  </div>
  </main>
</div>

<script>
/* ============================================================
   Theme — runs first, before anything else, to minimize any
   flash of the wrong theme.
   ============================================================ */
const MOON_ICON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
const SUN_ICON = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';

function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeIcon').innerHTML = theme === 'dark' ? SUN_ICON : MOON_ICON;
  localStorage.setItem('fleet_theme', theme);
}
applyTheme(localStorage.getItem('fleet_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
document.getElementById('themeToggle').addEventListener('click', () => {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});

/* ============================================================
   State — populated once config.json loads. index.html itself
   never needs editing to add/remove/relabel a bot.
   ============================================================ */
let OWNER, REPOS;
let currentFilter = localStorage.getItem('fleet_filter') || 'all';
let searchQuery = localStorage.getItem('fleet_search') || '';

const CATEGORY_LABELS = { price: 'Giá', finance: 'Tài chính', social: 'Mạng xã hội' };

const board    = document.getElementById('board');
const tokInput = document.getElementById('tok');
const rateInfo = document.getElementById('rateInfo');

/* ============================================================
   Boot
   ============================================================ */
async function loadConfig(){
  try{
    const res = await fetch('./config.json?_=' + Date.now());
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const cfg = await res.json();
    OWNER = cfg.owner;
    REPOS = cfg.repos || [];

    document.getElementById('ghOrgLink').href = `https://github.com/${OWNER}`;
    updateSidebarCounts();
    renderAll();
    updateLastRefreshed();

    setInterval(() => {
      REPOS.forEach(loadRepo);
      REPOS.forEach(loadLatestEmail);
      updateLastRefreshed();
    }, 5 * 60 * 1000);
  }catch(e){
    board.innerHTML = `<div class="load-error">Không đọc được config.json (${escapeHtml(e.message)}). File này phải nằm cùng thư mục với index.html.</div>`;
  }
}

/* ============================================================
   Controls: token persistence, search, filters, keyboard
   ============================================================ */
tokInput.value = localStorage.getItem('gh_pat') || '';
document.getElementById('saveTok').addEventListener('click', () => {
  localStorage.setItem('gh_pat', tokInput.value.trim());
  renderAll();
});
document.getElementById('refresh').addEventListener('click', renderAll);

function setFilter(filter){
  currentFilter = filter;
  localStorage.setItem('fleet_filter', filter);
  document.querySelectorAll('[data-filter]').forEach(el => {
    el.classList.toggle('active', el.dataset.filter === filter);
  });
  applyFilter();
}
document.querySelectorAll('[data-filter]').forEach(el => {
  el.addEventListener('click', () => setFilter(el.dataset.filter));
});
if(currentFilter !== 'all'){
  document.querySelectorAll('[data-filter]').forEach(el => {
    el.classList.toggle('active', el.dataset.filter === currentFilter);
  });
}

document.getElementById('topSearch').value = searchQuery;
document.getElementById('topSearch').addEventListener('input', (e) => {
  searchQuery = e.target.value.trim().toLowerCase();
  localStorage.setItem('fleet_search', searchQuery);
  applyFilter();
});
document.getElementById('clearFiltersBtn').addEventListener('click', () => {
  searchQuery = '';
  localStorage.setItem('fleet_search', '');
  document.getElementById('topSearch').value = '';
  setFilter('all');
});
document.addEventListener('keydown', (e) => {
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    const box = document.getElementById('topSearch');
    box.focus();
    box.select();
  }
});

function applyFilter(){
  let visible = 0;
  document.querySelectorAll('.row').forEach(row => {
    const matchesCategory = (currentFilter === 'all' || row.dataset.category === currentFilter);
    const matchesSearch = !searchQuery || row.id.toLowerCase().includes(searchQuery);
    const show = matchesCategory && matchesSearch;
    row.style.display = show ? '' : 'none';
    if(show) visible++;
  });

  const total = REPOS ? REPOS.length : 0;
  const healthy = document.querySelectorAll('.status-cell.success').length;
  const countText = visible === total ? `${total} bot` : `${visible} / ${total} bot`;
  const listCount = document.getElementById('listCount');
  if(listCount) listCount.textContent = `${countText} · ${healthy} chạy tốt ở lần gần nhất`;

  const emptyState = document.getElementById('emptyState');
  const tableCard = document.querySelector('.table-card');
  if(visible === 0){
    const bits = [];
    if(currentFilter !== 'all') bits.push(`nhóm "${CATEGORY_LABELS[currentFilter] || currentFilter}"`);
    if(searchQuery) bits.push(`từ khoá "${searchQuery}"`);
    document.getElementById('emptyStateDetail').textContent = bits.length ? ` với ${bits.join(' và ')}` : '';
    emptyState.style.display = 'block';
    if(tableCard) tableCard.style.display = 'none';
  }else{
    emptyState.style.display = 'none';
    if(tableCard) tableCard.style.display = '';
  }
}

/* ============================================================
   Column sorting
   ============================================================ */
let currentSort = JSON.parse(localStorage.getItem('fleet_sort') || 'null') || { field: null, dir: 'asc' };

function sortValue(row, field){
  if(field === 'bot') return row.id.toLowerCase();
  if(field === 'category') return (row.dataset.category || '').toLowerCase();
  if(field === 'status') return Number(row.dataset.statusSort ?? 9);
  if(field === 'time') return Number(row.dataset.timeSort ?? 0);
  return '';
}

function applySort(){
  if(!currentSort.field) return;
  const rows = Array.from(document.querySelectorAll('.row'));
  const dir = currentSort.dir === 'asc' ? 1 : -1;
  rows.sort((a, b) => {
    const va = sortValue(a, currentSort.field), vb = sortValue(b, currentSort.field);
    if(va < vb) return -1 * dir;
    if(va > vb) return 1 * dir;
    return 0;
  });
  rows.forEach(r => board.appendChild(r));
  updateSortIndicators();
}

function updateSortIndicators(){
  document.querySelectorAll('.th-sort').forEach(th => {
    const active = th.dataset.sort === currentSort.field;
    th.classList.toggle('sort-active', active);
    th.querySelector('.sort-arrow').textContent = active ? (currentSort.dir === 'asc' ? '▲' : '▼') : '';
  });
}

document.querySelectorAll('.th-sort').forEach(th => {
  th.addEventListener('click', () => {
    const field = th.dataset.sort;
    currentSort = (currentSort.field === field)
      ? { field, dir: currentSort.dir === 'asc' ? 'desc' : 'asc' }
      : { field, dir: 'asc' };
    localStorage.setItem('fleet_sort', JSON.stringify(currentSort));
    applySort();
  });
});

/* ============================================================
   Sidebar / overview numbers
   ============================================================ */
function updateSidebarCounts(){
  const counts = { price: 0, finance: 0, social: 0 };
  REPOS.forEach(r => { if(counts[r.category] !== undefined) counts[r.category]++; });
  document.getElementById('countAll').textContent = REPOS.length;
  document.getElementById('countPrice').textContent = counts.price;
  document.getElementById('countFinance').textContent = counts.finance;
  document.getElementById('countSocial').textContent = counts.social;
}

function refreshStats(){
  applyFilter(); // re-derives the "N bot · N chạy tốt" line as each repo's status resolves
}

function updateLastRefreshed(){
  const el = document.getElementById('lastUpdated');
  if(el) el.textContent = `Cập nhật lúc ${new Date().toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'})}, tự làm mới mỗi 5 phút.`;
}

/* ============================================================
   Small helpers
   ============================================================ */
function timeAgo(iso){
  if(!iso) return '—';
  const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
  if(s < 60) return 'vừa xong';
  const m = Math.floor(s/60); if(m < 60) return `${m} phút trước`;
  const h = Math.floor(m/60); if(h < 24) return `${h} giờ trước`;
  const d = Math.floor(h/24); return `${d} ngày trước`;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

const EVENT_LABELS = { schedule: 'theo lịch', workflow_dispatch: 'chạy tay', push: 'sau khi push', workflow_run: 'sau workflow khác' };
const CONCLUSION_LABELS = { cancelled: 'Đã huỷ', skipped: 'Bỏ qua', timed_out: 'Quá giờ', neutral: 'Không rõ', action_required: 'Cần xử lý', stale: 'Quá cũ' };

function conclusionInfo(run){
  if(!run) return {cls:'unknown', label:'Chưa chạy'};
  if(run.status !== 'completed') return {cls:'pending', label: run.status === 'queued' ? 'Đang chờ' : 'Đang chạy'};
  if(run.conclusion === 'success') return {cls:'success', label:'Thành công'};
  if(run.conclusion === 'failure') return {cls:'failure', label:'Lỗi'};
  return {cls:'unknown', label: CONCLUSION_LABELS[run.conclusion] || run.conclusion || 'Không rõ'};
}

function historyBars(runs){
  const last10 = runs.slice(0, 10).reverse();
  const bars = last10.map(r => {
    const cls = r.status !== 'completed' ? '' : (r.conclusion === 'success' ? 'success' : 'failure');
    const when = new Date(r.run_started_at || r.created_at).toLocaleString('vi-VN');
    return `<i class="${cls}" title="${escapeHtml(when)}: ${escapeHtml(conclusionInfo(r).label)}"></i>`;
  });
  while(bars.length < 10) bars.unshift('<i></i>');
  return bars.join('');
}

/* ============================================================
   Row rendering
   ============================================================ */
function rowSkeleton(repo){
  const cat = repo.category || 'none';
  return `
  <div class="row" id="row-${repo.name}" data-category="${cat}">
    <div class="cell-bot">
      <div class="name"><a href="https://github.com/${OWNER}/${repo.name}" target="_blank" rel="noopener">${repo.name}</a></div>
      <div class="meta"><span class="skeleton" style="width:110px"></span></div>
      <div class="mail-line empty" id="mail-line-${repo.name}" tabindex="0" role="button" aria-expanded="false"><span class="ico"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg></span><span class="subj"></span></div>
    </div>
    <div class="cat col-cat ${cat}"><span class="dot"></span>${CATEGORY_LABELS[repo.category] || repo.category || '—'}</div>
    <div class="status-cell"><span class="skeleton" style="width:64px"></span></div>
    <div class="history col-hist"></div>
    <div class="cell-time">—</div>
    <button class="btn btn-sm run-btn col-run" disabled>Chạy</button>
    <div class="mail-panel" id="mail-panel-${repo.name}"></div>
  </div>`;
}

function renderAll(){
  board.innerHTML = REPOS.map(rowSkeleton).join('');
  applyFilter();
  updateSortIndicators();
  REPOS.forEach(loadRepo);
  REPOS.forEach(loadLatestEmail);
}

/* ============================================================
   GitHub Actions: status + trigger
   ============================================================ */
async function fetchRuns(repo){
  const url = repo.workflow
    ? `https://api.github.com/repos/${OWNER}/${repo.name}/actions/workflows/${repo.workflow}/runs?per_page=10`
    : `https://api.github.com/repos/${OWNER}/${repo.name}/actions/runs?per_page=10`;
  const res = await fetch(url, { headers: { 'Accept': 'application/vnd.github+json' }});
  const remaining = res.headers.get('x-ratelimit-remaining');
  if(remaining) rateInfo.textContent = `GitHub API còn ${remaining} lượt gọi trong giờ này.`;
  if(!res.ok) throw new Error(`${res.status}`);
  const data = await res.json();
  return data.workflow_runs || [];
}

async function loadRepo(repo){
  const row = document.getElementById(`row-${repo.name}`);
  try{
    const runs = await fetchRuns(repo);
    const latest = runs[0];
    const info = conclusionInfo(latest);
    row.querySelector('.meta').textContent = latest ? `#${latest.run_number} · ${EVENT_LABELS[latest.event] || latest.event}` : 'chưa có lần chạy nào';
    const statusCell = row.querySelector('.status-cell');
    statusCell.className = `tag status-cell ${info.cls}`;
    statusCell.textContent = info.label;
    row.querySelector('.cell-time').textContent = latest ? timeAgo(latest.run_started_at || latest.created_at) : '—';
    row.querySelector('.history').innerHTML = historyBars(runs);
    row.dataset.statusSort = ({failure:0, pending:1, unknown:2, success:3})[info.cls] ?? 2;
    row.dataset.timeSort = latest ? new Date(latest.run_started_at || latest.created_at).getTime() : 0;
    const btn = row.querySelector('.run-btn');
    btn.disabled = false;
    btn.addEventListener('click', () => triggerRun(repo, btn));
  }catch(e){
    row.querySelector('.meta').textContent = `không tải được (${e.message})`;
    const statusCell = row.querySelector('.status-cell');
    statusCell.className = 'tag status-cell unknown';
    statusCell.textContent = 'Không có dữ liệu';
    row.dataset.statusSort = 2;
    row.dataset.timeSort = 0;
  }
  refreshStats();
  applySort();
}

async function triggerRun(repo, btn){
  const token = localStorage.getItem('gh_pat');
  if(!token){
    alert('Hãy dán token vào ô "Token" ở cột bên trái rồi bấm "Lưu" trước. Cần fine-grained token có quyền Actions: Read and write (hoặc classic token có quyền repo).');
    return;
  }
  btn.disabled = true; btn.textContent = 'Đang gửi…';
  try{
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${repo.name}/actions/workflows/${repo.workflow}/dispatches`, {
      method: 'POST',
      headers: {
        'Accept': 'application/vnd.github+json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({ ref: 'main' })
    });
    if(res.status === 204){
      btn.textContent = 'Đã gửi lệnh';
      setTimeout(() => loadRepo(repo), 3000);
    } else if(res.status === 401){
      btn.textContent = 'Sai token';
      btn.title = '401: token bị từ chối. Kiểm tra token được dán đủ, không thừa dấu cách và chưa hết hạn.';
    } else if(res.status === 403){
      btn.textContent = 'Không có quyền';
      btn.title = '403: token hợp lệ nhưng thiếu quyền Actions: Read and write trên repo này.';
    } else if(res.status === 404){
      btn.textContent = 'Không tìm thấy';
      btn.title = '404: repo không nằm trong danh sách repo của token, hoặc tên workflow trong config.json không khớp với file trong .github/workflows/.';
    } else {
      btn.textContent = `Lỗi ${res.status}`;
    }
  }catch(e){
    btn.textContent = 'Lỗi';
  }
  setTimeout(() => { btn.disabled = false; btn.textContent = 'Chạy'; }, 2500);
}

/* ============================================================
   Last-sent email, read from each repo's own latest.json
   ============================================================ */
async function loadLatestEmail(repo){
  const lineEl  = document.getElementById(`mail-line-${repo.name}`);
  const panelEl = document.getElementById(`mail-panel-${repo.name}`);
  try{
    const res = await fetch(`https://raw.githubusercontent.com/${OWNER}/${repo.name}/main/latest.json?_=${Date.now()}`);
    if(!res.ok) throw new Error('not found');
    const data = await res.json();
    const subject = data.subject || '(không có tiêu đề)';
    const body    = data.preview || data.body || '(không lưu nội dung)';
    const sentAt  = data.sent_at || data.timestamp || null;

    lineEl.classList.remove('empty');
    lineEl.querySelector('.subj').textContent = subject;
    lineEl.title = 'Bấm để xem email đã gửi';
    panelEl.innerHTML = `
      <div class="subject">${escapeHtml(subject)}</div>
      <div class="body-text">${escapeHtml(body)}</div>
      <div class="sent">Gửi ${sentAt ? timeAgo(sentAt) : '—'}</div>
    `;
    const toggle = () => {
      const isOpen = panelEl.classList.toggle('open');
      lineEl.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    };
    lineEl.onclick = toggle;
    lineEl.onkeydown = (e) => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); }
    };
  }catch(e){
    // No latest.json in this repo: leave the line hidden rather than repeat "nothing here" on every row.
    lineEl.classList.add('empty');
  }
}
