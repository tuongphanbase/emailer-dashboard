<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giá hôm nay</title>
<meta name="description" content="Giá vàng, tỷ giá, chứng khoán, lãi suất và giá điện thoại hôm nay, trên một trang.">
<script>
  // Same theme choice as the dashboard (saved by index.html), else the system's.
  (function(){
    let t = null; try{ t = localStorage.getItem('fleet_theme'); }catch(e){}
    document.documentElement.setAttribute('data-theme', t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  })();
</script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="markets.css">
<style>
  main{max-width:1240px;margin:0 auto;padding:20px 24px 48px;}
  .p-jump{display:flex;gap:4px 18px;flex-wrap:wrap;margin:0 0 16px;padding:0 0 12px;border-bottom:1px solid var(--border);}
  .p-jump a{font-size:13px;color:var(--text-secondary);text-decoration:none;}
  .p-jump a:hover{color:var(--brand);text-decoration:underline;}
  .m-card{scroll-margin-top:64px;}
  @media (max-width:600px){ main{padding:16px 16px 40px;} }
</style>
</head>
<body>
<header class="appbar">
  <a class="appbar-name" href="./">tuongphanbase</a>
  <nav class="appbar-tabs" aria-label="Trang">
    <a href="./">Bot</a>
    <a href="prices.html" aria-current="page">Giá hôm nay</a>
    <a href="projects.html">Dự án</a>
  </nav>
</header>
<main>
  <div class="page-head">
    <div>
      <h1>Giá hôm nay</h1>
      <div class="page-sub"><span id="today"></span> · <span id="updated">Đang tải…</span></div>
    </div>
    <div class="range-tabs" role="group" aria-label="Khoảng thời gian">
      <button data-range="7" aria-pressed="false">7 ngày</button>
      <button data-range="30" aria-pressed="true">30 ngày</button>
      <button data-range="90" aria-pressed="false">90 ngày</button>
    </div>
  </div>
  <nav class="p-jump" id="jump" aria-label="Đi tới mục"></nav>
  <div id="mSections"></div>
</main>
<script src="markets.js"></script>
<script>
  document.getElementById('today').textContent =
    new Date().toLocaleDateString('vi-VN', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'});
  Markets.mount({
    sections: document.getElementById('mSections'),
    updated: document.getElementById('updated'),
    tabs: document.querySelectorAll('.range-tabs button'),
    compact: true,
  }).then(data => {
    const jump = document.getElementById('jump');
    ((data && data.sections) || []).filter(s => s.ok && s.id !== 'health').forEach(s => {
      const a = document.createElement('a');
      a.href = `#m-${s.id}`; a.textContent = s.title;
      jump.appendChild(a);
    });
    if(!jump.children.length) jump.remove();
  });
</script>
</body>
</html>
