<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dự án</title>
<meta name="description" content="Tất cả trang web và bot của tuongphanbase.">
<script>
  (function(){
    let t = null; try{ t = localStorage.getItem('fleet_theme'); }catch(e){}
    document.documentElement.setAttribute('data-theme', t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  })();
</script>
<link rel="stylesheet" href="theme.css">
<style>
  main{max-width:1100px;margin:0 auto;padding:20px 24px 56px;}
  h2{font-size:15px;font-weight:600;margin:28px 0 8px;}
  h2 .n{font-weight:400;color:var(--text-tertiary);margin-left:6px;}
  .list{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;}
  .item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);}
  .item:last-child{border-bottom:none;}
  .item:hover{background:var(--surface-alt);}
  .item h3{margin:0;font-size:14px;font-weight:600;}
  .item p{margin:2px 0 0;font-size:13px;line-height:1.5;color:var(--text-secondary);}
  .links{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .links a.main{color:var(--brand);font-weight:600;}
  .error{color:var(--danger);padding:12px 16px;margin:0;}
  @media (max-width:640px){
    main{padding:16px 16px 40px;}
    .item{grid-template-columns:1fr;}
    .links{justify-content:flex-start;}
  }
</style>
</head>
<body>
<header class="appbar">
  <a class="appbar-name" href="./">tuongphanbase</a>
  <nav class="appbar-tabs" aria-label="Trang">
    <a href="./">Bot</a>
    <a href="prices.html">Giá hôm nay</a>
    <a href="projects.html" aria-current="page">Dự án</a>
  </nav>
</header>
<main>
  <div class="page-head">
    <div>
      <h1>Dự án</h1>
      <div class="page-sub">Các trang web và bot tự động gửi email.</div>
    </div>
  </div>
  <h2>Trang web<span class="n" id="sitesCount"></span></h2>
  <div class="list" id="sites"></div>
  <h2>Bot gửi email<span class="n" id="botsCount"></span></h2>
  <div class="list" id="bots"></div>
</main>
<script>
  const el = (tag, cls, text) => { const n = document.createElement(tag); if(cls) n.className = cls; if(text != null) n.textContent = text; return n; };
  function link(text, href, primary){ const a = el('a', primary ? 'btn btn-sm main' : 'btn btn-sm', text); a.href = href; return a; }

  function item(p, owner){
    const pages = `https://${owner}.github.io/${p.repo}/`;
    const repo = `https://github.com/${owner}/${p.repo}`;
    const row = el('article', 'item');
    const text = el('div');
    text.append(el('h3', null, p.title || p.repo), el('p', null, p.description || ''));
    const links = el('div', 'links');
    if(p.kind === 'site') links.append(link('Mở', p.repo === 'emailer-dashboard' ? './' : pages, true));
    else if(p.pages) links.append(link('Bảng giá', pages, true));
    (p.links || []).forEach(([label, href]) => links.append(link(label, href)));
    links.append(link('Mã nguồn', repo));
    row.append(text, links);
    return row;
  }

  fetch('config.json?_=' + Date.now()).then(r => r.json()).then(cfg => {
    const owner = cfg.owner;
    const counts = {sites: 0, bots: 0};
    (cfg.projects || []).forEach(p => {
      const where = p.kind === 'site' ? 'sites' : 'bots';
      counts[where]++;
      document.getElementById(where).appendChild(item(p, owner));
    });
    document.getElementById('sitesCount').textContent = counts.sites;
    document.getElementById('botsCount').textContent = counts.bots;
  }).catch(e => {
    document.getElementById('sites').appendChild(el('p', 'error', `Không đọc được config.json (${e.message}).`));
  });
</script>
</body>
</html>
